<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Backoffice · Registro de Campo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">BACKOFFICE</div>
      <div class="subtitle">Registro visual de campo · Prueba técnica 01</div>
    </div>
    <div id="statusBadge" class="status">Preparando…</div>
  </header>

  <main class="app">
    <section class="context-card">
      <label for="project">Proyecto</label>
      <input id="project" value="ALTOS DE EGIPTO">
      <label for="context">Contexto</label>
      <input id="context" value="CUBIERTA">
    </section>

    <section class="camera-card">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div class="camera-actions">
        <button id="startCamera" class="secondary">Activar cámara</button>
        <button id="capture" class="capture" disabled aria-label="Tomar foto"></button>
      </div>
    </section>

    <section class="summary">
      <div>
        <strong id="countPending">0</strong>
        <span>guardadas localmente</span>
      </div>
      <button id="showGallery" class="secondary">Ver galería</button>
    </section>

    <section id="gallery" class="gallery hidden"></section>
  </main>

  <footer class="footer">Original único · almacenamiento local temporal</footer>
  <script src="app.js"></script>
</body>
</html>
